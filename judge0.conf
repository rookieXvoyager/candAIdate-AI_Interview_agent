# PostgreSQL
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=YourSecurePassword

# Redis
REDIS_PASSWORD=YourRedisPassword

# Submission limits — these are your hard ceilings
CPU_TIME_LIMIT=10          
MAX_CPU_TIME_LIMIT=15      
CPU_EXTRA_TIME=2
WALL_TIME_LIMIT=20         
MAX_WALL_TIME_LIMIT=30
MEMORY_LIMIT=512000        
MAX_MEMORY_LIMIT=1024000

# Worker count — critical: for Java-heavy workloads, use nproc not 2*nproc
# On a standard Mac, 4 workers is a very safe balance.
COUNT=4

# Security — never expose to public internet without this
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=YourSecureToken

# Disable network access inside sandboxes so candidates can't make external API calls
ALLOW_ENABLE_NETWORK=false