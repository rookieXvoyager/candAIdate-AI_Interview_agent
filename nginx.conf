server {
    listen 80;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    
    # Where to find the React static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # 🚨 CRITICAL FOR REACT ROUTER 🚨
        # If the user goes to /interview directly, Nginx won't find a folder named "interview".
        # This tells Nginx to route all unknown paths back to index.html so React can handle the routing!
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
